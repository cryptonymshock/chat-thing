name = "edge-chat-demo"
compatibility_date = "2024-01-01"

main = "src/chat.mjs"

[durable_objects]
bindings = [
  { name = "rooms", class_name = "ChatRoom" },
  { name = "limiters", class_name = "RateLimiter" },
  { name = "users", class_name = "UserMailbox" },
  { name = "groups", class_name = "GroupChat" },
]

[[rules]]
type = "Data"
globs = ["**/*.html"]
fallthrough = false

# Indicate that you want the ChatRoom and RateLimiter classes to be callable as Durable Objects.
[[migrations]]
tag = "v1"                                       # Should be unique for each entry
new_sqlite_classes = ["ChatRoom", "RateLimiter"]

# UserMailbox is a new class added after the original deploy, so it gets its own migration entry.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserMailbox"]

# GroupChat is a new class added after that, so it also gets its own migration entry.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["GroupChat"]
